[project]
name = "pygeoapi-run"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygeoapi==0.24.0",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "gunicorn>=23.0.0",
    "gevent>=25.9.1",
    "pyyaml",
    "s3fs",
    "rasterio",
    "django-environ",
    "geopandas>=1.1.1",
    "structlog",
    "typer",
    "schedule>=1.2.2",
    "uvicorn>=0.40.0",
    "starlette>=0.51.0",
    "jsonpatch>=1.33",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.59,<0.60"

[tool.pixi.dependencies]
python = "3.15.*"
gdal = "==3.13.3"
libgdal-arrow-parquet = "==3.13.3"
